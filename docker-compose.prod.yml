services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
      target: prod
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    restart: unless-stopped
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      target: prod
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  mongo-data:
