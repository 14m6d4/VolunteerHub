name: volunteerhub-prod

services:
  # No published port: only reachable on the compose network. POSTGRES_USER,
  # POSTGRES_PASSWORD and POSTGRES_DB come from backend/.env.
  postgres:
    image: postgres:17-alpine
    env_file:
      - ./backend/.env
    restart: unless-stopped
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: applies pending SQL migrations and exits. A failure fails
  # `up -d`, and so the deploy. Same image as the backend, so the schema
  # always matches the code being deployed.
  migrate:
    image: ghcr.io/14m6d4/volunteerhub-backend:${IMAGE_TAG:?set IMAGE_TAG to a commit SHA}
    command: ["node", "dist/db/migrate.js"]
    env_file:
      - ./backend/.env
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # Images are built and pushed by CI; IMAGE_TAG is the commit SHA, written
  # to .env by the deploy.
  backend:
    image: ghcr.io/14m6d4/volunteerhub-backend:${IMAGE_TAG:?set IMAGE_TAG to a commit SHA}
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      # Only Traefik is trusted as a hop. Cloudflare appends to X-Forwarded-For
      # instead of replacing it, so trusting two hops let a client forge its own
      # entry; the real client comes from CF-Connecting-IP in rateLimit.middleware.
      TRUST_PROXY: 1
    restart: unless-stopped
    # Uploaded images, served at /uploads. Not backed up (docs/adr/0002).
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Prometheus metrics are at :5000/metrics. The VM's Alloy agent scrapes
    # them as volunteerhub-prod-backend-1:5000 over the proxy network, so a
    # project or service rename needs its config (VM repo, alloy/) updated too.
    # The Traefik router below matches /api and /uploads, so /metrics is never
    # routed (and the app refuses it when X-Forwarded-For is set anyway).
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vh-api.rule=Host(`volunteerhub.l4mbd4.me`) && (PathPrefix(`/api`) || PathPrefix(`/uploads`))"
      - "traefik.http.routers.vh-api.entrypoints=websecure"
      - "traefik.http.routers.vh-api.priority=100"
      - "traefik.http.services.vh-api.loadbalancer.server.port=5000"

  # Daily pg_dump to the OCI backup bucket (backup/backup.sh). .env.backup
  # holds the bucket's write key; it lives only on the VM. The staleness alert
  # (VM repo, alloy/alerts.py) finds its logs by project and service name, so a
  # rename needs that query updated too.
  backup:
    image: ghcr.io/14m6d4/volunteerhub-backup:${IMAGE_TAG:?set IMAGE_TAG to a commit SHA}
    env_file:
      - ./backend/.env
      - ./.env.backup
    # The script's shell would be PID 1 otherwise, which ignores SIGTERM: every
    # deploy would wait out the 10s stop timeout.
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # Nightly demo reset (docs/operations.md): rebuilds the demo accounts' data
  # with `seed.js --reset-demo`. Needs SEED_DEMO_PASSWORD in backend/.env and
  # skips the run without it. The hour differs from the backup's (20 UTC).
  demo-reset:
    image: ghcr.io/14m6d4/volunteerhub-backend:${IMAGE_TAG:?set IMAGE_TAG to a commit SHA}
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      # 04:00 in Vietnam, clear of the backup and the VM's 02:00-05:00 UTC CPU reclaim guard.
      DEMO_RESET_HOUR_UTC: 21
    command:
      - sh
      - -c
      - |
        while :; do
          sleep $$((86400 - ($$(date +%s) - DEMO_RESET_HOUR_UTC * 3600) % 86400))
          if [ -z "$${SEED_DEMO_PASSWORD:-}" ]; then echo "demo reset skipped: SEED_DEMO_PASSWORD is unset"; continue; fi
          node dist/scripts/seed.js --reset-demo && echo "demo reset ok" || echo "demo reset failed: exit $$?"
        done
    # Deletes the demo users' uploads and copies the demo covers back.
    volumes:
      - uploads:/app/uploads
    # Same reason as the backup's: a shell as PID 1 ignores SIGTERM.
    init: true
    restart: unless-stopped
    # The image's healthcheck probes the API, which this container does not run.
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    image: ghcr.io/14m6d4/volunteerhub-frontend:${IMAGE_TAG:?set IMAGE_TAG to a commit SHA}
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vh-web.rule=Host(`volunteerhub.l4mbd4.me`)"
      - "traefik.http.routers.vh-web.entrypoints=websecure"
      - "traefik.http.routers.vh-web.priority=10"
      - "traefik.http.services.vh-web.loadbalancer.server.port=80"

volumes:
  pg-data:
  uploads:

networks:
  proxy:
    external: true
