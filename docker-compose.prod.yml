name: volunteerhub-prod

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Images are built and pushed by CI; IMAGE_TAG is the commit SHA, written
  # to .env by the deploy.
  backend:
    image: ghcr.io/14m6d4/volunteerhub-backend:${IMAGE_TAG:?set IMAGE_TAG to a commit SHA}
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      # Only Traefik is trusted as a hop. Cloudflare appends to X-Forwarded-For
      # instead of replacing it, so trusting two hops let a client forge its own
      # entry; the real client comes from CF-Connecting-IP in rateLimit.middleware.
      TRUST_PROXY: 1
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vh-api.rule=Host(`volunteerhub.l4mbd4.me`) && (PathPrefix(`/api`) || PathPrefix(`/file`) || PathPrefix(`/uploads`))"
      - "traefik.http.routers.vh-api.entrypoints=websecure"
      - "traefik.http.routers.vh-api.priority=100"
      - "traefik.http.services.vh-api.loadbalancer.server.port=5000"

  frontend:
    image: ghcr.io/14m6d4/volunteerhub-frontend:${IMAGE_TAG:?set IMAGE_TAG to a commit SHA}
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vh-web.rule=Host(`volunteerhub.l4mbd4.me`)"
      - "traefik.http.routers.vh-web.entrypoints=websecure"
      - "traefik.http.routers.vh-web.priority=10"
      - "traefik.http.services.vh-web.loadbalancer.server.port=80"

volumes:
  mongo-data:

networks:
  proxy:
    external: true
