name: CI/CD

on:
  push:
    branches: [main]
    paths: &paths
      - backend/**
      - frontend/**
      - docker-compose*.yml
      - .github/workflows/**
  pull_request:
    branches: [main]
    paths: *paths
  workflow_dispatch:
    inputs:
      sha:
        description: Deploy this retained image tag (full commit SHA) instead of building. Empty = build and deploy the branch head.
        required: false
        type: string

# Jobs that push images or pull them on the VM widen this per job.
permissions:
  contents: read

env:
  # Image label: links GHCR packages to this repo, and scopes the VM's prune.
  IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}

# Superseded PR runs are cancelled; main runs queue, so a deploy is never cut off mid-flight.
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    if: ${{ !inputs.sha }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build

  frontend:
    if: ${{ !inputs.sha }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Native arm64 runner: the VM is aarch64, so no QEMU emulation.
  images:
    needs: [backend, frontend]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: backend
          - image: frontend
            build-args: VITE_API_URL=/api
    env:
      # PRs build the image but never push it.
      PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.image }}
          target: prod
          build-args: ${{ matrix.build-args }}
          push: ${{ env.PUSH == 'true' }}
          # One manifest per push, so each SHA is exactly one package version
          # and the retention count below means 5 deployable tags.
          provenance: false
          tags: ghcr.io/${{ github.repository_owner }}/volunteerhub-${{ matrix.image }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ env.IMAGE_SOURCE }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - if: env.PUSH == 'true'
        uses: actions/delete-package-versions@v5
        with:
          package-name: volunteerhub-${{ matrix.image }}
          package-type: container
          min-versions-to-keep: 5

  deploy:
    needs: images
    # A manual SHA deploy skips the build jobs. Only then is a skipped `images` fine:
    # a failed check upstream also shows up here as "skipped".
    if: >-
      !cancelled()
      && (needs.images.result == 'success' || (inputs.sha && needs.images.result == 'skipped'))
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      SHA: ${{ inputs.sha || github.sha }}
    steps:
      # Checked here, before the dispatch input gets anywhere near the VM's shell.
      - name: Validate SHA
        run: '[[ $SHA =~ ^[0-9a-f]{40}$ ]] || { echo "::error::not a full commit SHA: $SHA"; exit 1; }'
      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: SHA,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd ~/volunteerhub
            # Last SHA that passed the smoke test; written only after a pass.
            LAST_GOOD_FILE=.last-good-sha
            LAST_GOOD_SHA="$(cat "$LAST_GOOD_FILE" 2>/dev/null || true)"

            # Throwaway Docker config: the job-scoped token never lands in ~/.docker.
            DOCKER_CONFIG="$(mktemp -d)"
            export DOCKER_CONFIG
            trap 'rm -rf "$DOCKER_CONFIG"' EXIT
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            git fetch --prune origin

            # Both functions run as `if` conditions, where set -e is off: hence the && chains.
            # The checkout only supplies the compose file; images come from GHCR. Compose
            # reads .env, so manual compose commands on the VM get the tag too.
            # --policy missing: a rollback reuses the known-good image still on disk.
            deploy() {
              echo "deploying $1" &&
              git checkout --force --detach "$1" &&
              echo "IMAGE_TAG=$1" > .env &&
              docker compose -f docker-compose.prod.yml pull --policy missing backend frontend &&
              docker compose -f docker-compose.prod.yml up -d
            }
            # Runs here, not on the runner: the domain is proxied by Cloudflare, which
            # 403s GitHub Actions' datacenter IPs. The VM's own requests still egress to
            # Cloudflare and back, so this stays a real end-to-end check of
            # Cloudflare -> Traefik -> container.
            # Bodies are checked, not just status: while the backend is starting or
            # unhealthy Traefik drops its router, and /api/* falls through to the SPA,
            # which answers 200 with index.html.
            URL=https://volunteerhub.l4mbd4.me
            expect() { # path, fixed string the body must contain; retries for ~60s
              for _ in {1..12}; do
                curl -fsS "$URL$1" | grep -F "$2" > /dev/null && return 0
                sleep 5
              done
              echo "::error::$URL$1 never returned a body containing $2"
              return 1
            }
            smoke() {
              expect / '<div id="root">' &&
              expect /api/health '"status":"ok"' &&
              expect '/api/events?limit=1' '"success":true'
            }

            status=0
            if deploy "$SHA" && smoke; then
              echo "$SHA" > "$LAST_GOOD_FILE"
              echo "smoke test passed, $SHA is live"
            else
              status=1
              echo "::error::$SHA failed to deploy or failed its smoke test"
              if [[ -z $LAST_GOOD_SHA || $LAST_GOOD_SHA == "$SHA" ]]; then
                echo "::error::no other known-good SHA to roll back to"
              elif deploy "$LAST_GOOD_SHA" && smoke; then
                echo "::error::rolled back to $LAST_GOOD_SHA, which passed the smoke test"
              else
                echo "::error::rollback to $LAST_GOOD_SHA failed its smoke test too"
              fi
            fi

            # Old SHAs no container uses any more. The label scopes this to our images.
            docker image prune -af --filter "label=org.opencontainers.image.source=${{ env.IMAGE_SOURCE }}"
            exit "$status"
