name: volunteerhub-dev

services:
  # Dev-only credentials. Matches DATABASE_URL in backend/.env.example.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: volunteerhub
      POSTGRES_PASSWORD: volunteerhub
      POSTGRES_DB: volunteerhub
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volunteerhub -d volunteerhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    env_file:
      - ./backend/.env
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    env_file:
      - ./frontend/.env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pg-data:
